services:
  db:
    image: postgres:17-alpine
    container_name: authorization-db
    environment:
      POSTGRES_DB: authorization_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d authorization_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auth-network

  api:
    build:
      context: ./src/Authorization.API
      dockerfile: Dockerfile
    container_name: authorization-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=authorization_db;Username=auth_user;Password=auth_password"
      Jwt__Key: "ThisIsASuperSecretKeyForJwtTokenGenerationThatIsAtLeast32Chars!"
      Jwt__Issuer: "Authorization.API"
      Jwt__Audience: "Authorization.API"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  auth-network:
    driver: bridge
